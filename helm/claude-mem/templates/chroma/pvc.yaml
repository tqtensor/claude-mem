{{- if and .Values.chroma.enabled (not .Values.chroma.external) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "claude-mem.fullname" . }}-chroma
  labels:
    {{- include "claude-mem.chroma.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.chroma.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.chroma.size }}
  {{- if .Values.chroma.storageClass }}
  storageClassName: {{ .Values.chroma.storageClass | quote }}
  {{- end }}
{{- end }}
