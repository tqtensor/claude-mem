{{- if and (not .Values.auth.existingSecret) (gt (len .Values.auth.keys) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-mem.authSecretName" . }}
  labels:
    {{- include "claude-mem.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: {{ include "claude-mem.apiKeysValue" . | quote }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.existingSecret) .Values.database.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-mem.dbSecretName" . }}
  labels:
    {{- include "claude-mem.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
{{- end }}
{{- if and (not .Values.chroma.external) .Values.chroma.apiKey (not .Values.chroma.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-mem.fullname" . }}-chroma
  labels:
    {{- include "claude-mem.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.chroma.apiKey | quote }}
{{- end }}
